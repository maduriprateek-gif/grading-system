<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - Grading System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

<div class="login-container">

    <div class="login-card">

        <div class="login-logo">
            🔐
        </div>

        <h1>
            Reset Password
        </h1>

        <p class="login-subtitle">
            Create a new password
        </p>

        <form id="resetPasswordForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >


            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                required
            >


            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                required
            >


            <button
                type="submit"
                class="login-button"
            >
                Reset Password
            </button>

        </form>


        <p id="resetMessage"></p>


        <p>

            <a href="login.html">
                Back to Login
            </a>

        </p>


        <p class="login-footer">
            Grading System © 2026
        </p>

    </div>

</div>


<script src="reset-password.js"></script>

</body>

</html>
